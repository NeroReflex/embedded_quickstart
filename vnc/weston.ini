# weston configuration generated from autologin-firstboot.sh
[core]
shell=kiosk
modules=screen-share.so
#backend=drm,vnc
backend=drm
idle-time=0

[vnc]
refresh-rate=15
tls-key=/home/user/tls.key
tls-cert=/home/user/tls.crt

#[output]
#name=LVDS-1

#[output]
#name=vnc-0
#mirror-of=LVDS-1

[screen-share]
command=/usr/bin/weston --config=/etc/weston.ini --backend=vnc-backend.so --vnc-tls-cert=/home/user/tls.crt --vnc-tls-key=/home/user/tls.key --shell=fullscreen-shell.so
start-on-startup=true

[autolaunch]
path=/usr/bin/start-login_ng-session
watch=true